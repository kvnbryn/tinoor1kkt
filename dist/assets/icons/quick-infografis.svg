<svg width="88" height="88" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tablet Board Background Gradient -->
    <linearGradient id="info88-board" x1="10" y1="10" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Bar 1 (Electric Violet) -->
    <linearGradient id="bar88-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <!-- Bar 2 (Royal Blue) -->
    <linearGradient id="bar88-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Bar 3 (Emerald Green) -->
    <linearGradient id="bar88-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Bar 4 (Cyan / Highest Tower) -->
    <linearGradient id="bar88-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Trend Arrow Gold to Coral -->
    <linearGradient id="trend88-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="info88-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Disc -->
  <circle cx="44" cy="44" r="41" fill="#EFF6FF"/>
  <circle cx="44" cy="44" r="34" fill="#DBEAFE" opacity="0.6"/>

  <g filter="url(#info88-shadow)">
    <!-- Dashboard Screen / Canvas Base -->
    <rect x="10" y="12" width="68" height="64" rx="12" fill="url(#info88-board)" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Dashboard Header Bar -->
    <rect x="16" y="18" width="22" height="4" rx="2" fill="#94A3B8"/>
    <!-- Window Control Dots -->
    <circle cx="68" cy="20" r="2.2" fill="#EF4444"/>
    <circle cx="61" cy="20" r="2.2" fill="#FBBF24"/>
    <circle cx="54" cy="20" r="2.2" fill="#10B981"/>

    <!-- Data Grid Lines -->
    <line x1="16" y1="32" x2="72" y2="32" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="16" y1="46" x2="72" y2="46" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="16" y1="60" x2="72" y2="60" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Top Left: Donut Demographic Pie Chart -->
    <circle cx="25" cy="33" r="8" stroke="#E2E8F0" stroke-width="4.5" fill="none"/>
    <path d="M25 25 A8 8 0 0 1 33 33" stroke="#F43F5E" stroke-width="4.5" fill="none"/>
    <path d="M33 33 A8 8 0 0 1 25 41" stroke="#FBBF24" stroke-width="4.5" fill="none"/>
    <path d="M25 41 A8 8 0 0 1 17 33" stroke="#06B6D4" stroke-width="4.5" fill="none"/>

    <!-- Demographic Mini Icon (Population Silhouette) -->
    <circle cx="39" cy="30" r="2.5" fill="#3B82F6"/>
    <path d="M35 37 C35 34 43 34 43 37 Z" fill="#3B82F6"/>

    <!-- Vibrant 3D Bar Chart Pillars -->
    <!-- Bar 1: Violet -->
    <rect x="33" y="45" width="8" height="20" rx="4" fill="url(#bar88-purple)"/>
    <rect x="34.5" y="46" width="2.5" height="18" rx="1.2" fill="#FFFFFF" opacity="0.35"/>

    <!-- Bar 2: Royal Blue -->
    <rect x="44" y="37" width="8" height="28" rx="4" fill="url(#bar88-blue)"/>
    <rect x="45.5" y="38" width="2.5" height="26" rx="1.2" fill="#FFFFFF" opacity="0.35"/>

    <!-- Bar 3: Emerald Green -->
    <rect x="55" y="42" width="8" height="23" rx="4" fill="url(#bar88-green)"/>
    <rect x="56.5" y="43" width="2.5" height="21" rx="1.2" fill="#FFFFFF" opacity="0.35"/>

    <!-- Bar 4: Sky/Cyan Tallest -->
    <rect x="66" y="28" width="8" height="37" rx="4" fill="url(#bar88-cyan)"/>
    <rect x="67.5" y="29" width="2.5" height="35" rx="1.2" fill="#FFFFFF" opacity="0.35"/>

    <!-- Dynamic Growth Curve (Golden Glowing Line) -->
    <path d="M21 50 L37 43 L48 35 L59 40 L71 21" stroke="url(#trend88-gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data Nodes on Curve -->
    <circle cx="21" cy="50" r="2.8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="37" cy="43" r="2.8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="48" cy="35" r="2.8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="59" cy="40" r="2.8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>

    <!-- Glowing Arrow Tip -->
    <path d="M71 21 L64 22 M71 21 L69 28" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="21" r="3.2" fill="#EF4444"/>

    <!-- Ambient Sparkles -->
    <polygon points="76,10 77.5,13 80,14 77.5,15 76,18 74.5,15 72,14 74.5,13" fill="#FBBF24"/>
    <polygon points="12,8 13.2,10 15,11 13.2,12 12,14 10.8,12 9,11 10.8,10" fill="#F59E0B"/>
  </g>
</svg>
