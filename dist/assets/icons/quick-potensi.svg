<svg width="88" height="88" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip Path inside landscape frame -->
    <clipPath id="pot88-clip">
      <rect x="10" y="10" width="68" height="68" rx="18"/>
    </clipPath>

    <!-- Sky Gradient -->
    <linearGradient id="pot88-sky" x1="44" y1="10" x2="44" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <!-- Sun Radiant -->
    <linearGradient id="pot88-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Mountain Back (Mahawu) -->
    <linearGradient id="pot88-mount1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Mountain Front (Lokon) -->
    <linearGradient id="pot88-mount2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Waterfall (Tekaan Telu) -->
    <linearGradient id="pot88-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Terrace Hill Agriculture -->
    <linearGradient id="pot88-terrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="50%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Golden Harvest -->
    <linearGradient id="pot88-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="pot88-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Disc -->
  <circle cx="44" cy="44" r="41" fill="#FFFBEB"/>
  <circle cx="44" cy="44" r="34" fill="#FEF3C7" opacity="0.6"/>

  <g filter="url(#pot88-shadow)">
    <!-- Badge Frame Border -->
    <rect x="10" y="10" width="68" height="68" rx="18" fill="#FFFFFF" stroke="#34D399" stroke-width="2"/>

    <!-- Clipped Landscape Illustration -->
    <g clip-path="url(#pot88-clip)">
      
      <!-- Sky -->
      <rect x="10" y="10" width="68" height="68" fill="url(#pot88-sky)"/>

      <!-- Radiant Sun in Sky -->
      <circle cx="44" cy="24" r="12" fill="url(#pot88-sun)"/>
      <circle cx="44" cy="24" r="16" fill="#FEF08A" opacity="0.4"/>

      <!-- Morning Clouds -->
      <path d="M16 28 C16 24 22 23 25 26 C27 23 32 23 34 26 C35 24 39 25 39 28 Z" fill="#FFFFFF" opacity="0.9"/>
      <path d="M57 22 C57 19 61 18 63 20 C64 18 68 19 70 21 Z" fill="#FFFFFF" opacity="0.85"/>

      <!-- Distant Volcano Peak (Mahawu) -->
      <polygon points="16,56 34,31 52,56" fill="url(#pot88-mount1)"/>
      <polygon points="34,31 31,36 37,37 34,31" fill="#A7F3D0" opacity="0.75"/>

      <!-- Main Volcano Peak (Gunung Lokon) -->
      <polygon points="34,62 56,27 78,62" fill="url(#pot88-mount2)"/>
      <polygon points="56,27 53,33 60,34 56,27" fill="#D1FAE5" opacity="0.85"/>

      <!-- Waterfall Stream: Tekaan Telu cascading from cliffs -->
      <path d="M42 47 Q40 57 39 65 Q44 68 49 65 Q46 57 46 47 Z" fill="url(#pot88-water)"/>
      <path d="M43 47 V65 M44.5 48 V64 M46 49 V65" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>

      <!-- Waterfall Lagoon Pool / Turquoise Splash -->
      <ellipse cx="44" cy="65" rx="12" ry="3.5" fill="#38BDF8"/>
      <ellipse cx="44" cy="65" rx="7" ry="1.8" fill="#F0FDF4"/>

      <!-- Terraced Agrikultur Hillside in Foreground -->
      <path d="M10 78 C22 62 36 65 42 78 Z" fill="url(#pot88-terrace)"/>
      <path d="M38 78 C48 64 66 63 78 78 Z" fill="url(#pot88-terrace)"/>
      <rect x="10" y="72" width="68" height="10" fill="#15803D"/>

      <!-- Agrikultur Details: Banana bunch & Coconut Palm -->
      <!-- Banana bunches on left -->
      <path d="M18 69 Q21 63 25 65 Q22 72 18 69 Z" fill="url(#pot88-gold)"/>
      <path d="M21 68 Q24 62 28 64 Q25 71 21 68 Z" fill="url(#pot88-gold)"/>

      <!-- Tropical Palm on Right -->
      <path d="M66 74 Q68 64 65 58" stroke="#78350F" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M65 58 Q59 55 57 60 M65 58 Q62 52 66 50 M65 58 Q71 53 74 58 M65 58 Q70 61 68 64" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Golden Sparkles -->
    <polygon points="73,14 74.5,17 77,18 74.5,19 73,22 71.5,19 69,18 71.5,17" fill="#FBBF24"/>
  </g>
</svg>
