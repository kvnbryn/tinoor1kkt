<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="50%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Sun -->
  <circle cx="560" cy="160" r="50" fill="#FFF9C4" opacity="0.8"/>
  
  <!-- Back Mountains -->
  <polygon points="120,500 360,200 600,500" fill="url(#mountGrad1)"/>
  <polygon points="400,500 620,230 840,500" fill="url(#mountGrad1)" opacity="0.7"/>
  
  <!-- Front Mountains -->
  <polygon points="-40,500 180,260 420,500" fill="url(#mountGrad2)"/>
  <polygon points="260,500 480,290 700,500" fill="url(#mountGrad2)"/>
  
  <!-- Ground Hill -->
  <path d="M0,420 Q200,380 400,430 T800,420 L800,500 L0,500 Z" fill="#2E7D32"/>
  
  <!-- Icon & Text Overlay -->
  <g transform="translate(400, 240)" text-anchor="middle">
    <circle cx="0" cy="-20" r="42" fill="white" opacity="0.9" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))"/>
    <path d="M-18,-24 L-8,-34 L-2,-28 L10,-40 L18,-30 L18,-10 L-18,-10 Z" fill="#388E3C" opacity="0.8"/>
    <circle cx="10" cy="-32" r="3" fill="#FBC02D"/>
    <text x="0" y="55" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#1B5E20">Foto Dokumentasi Panorama</text>
    <text x="0" y="80" font-family="'Outfit', sans-serif" font-size="14" font-weight="500" fill="#388E3C">Kelurahan Tinoor Satu</text>
  </g>
</svg>
